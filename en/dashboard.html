<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin dashboard</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="sidebar">
        <div id="logo">
            <img src="../resources/icons/view-dashboard.svg" alt="Dashboard icon">
            <h1>Dashboard</h1>
        </div>
        <ul id="nav-links">
            <li><a href="#"><img src="../resources/icons/home.svg" alt="Home icon"> Home</a></li>
            <li><a href="#"><img src="../resources/icons/account-details.svg" alt="Profile icon"> Profile</a></li>
            <li><a href="#"><img src="../resources/icons/message.svg" alt="Messages icon"> Messages</a></li>
            <li><a href="#"><img src="../resources/icons/history.svg" alt="History icon"> History</a></li>
            <li><a href="#"><img src="../resources/icons/label-multiple.svg" alt="Tasks icon"> Tasks</a></li>
            <li><a href="#"><img src="../resources/icons/account-group.svg" alt="Communities icon"> Communities</a></li>


            <li><a href="#"><img src="../resources/icons/cog.svg" alt="Settings icon"> Settings</a></li>
            <li><a href="#"><img src="../resources/icons/help-box.svg" alt="Support icon"> Support</a></li>
            <li><a href="#"><img src="../resources/icons/shield-check.svg" alt="Privacy icon"> Privacy</a></li>
        </ul>
    </nav>
    <header class="header">
        <div id="search-icon">
            <img src="../resources/icons/magnify.svg" alt="Search icon">
        </div>
        <div id="search-bar">
            <input type="text" id="searchfield" placeholder="Search...">
        </div>
        <div id="notification">
            <img src="../resources/icons/bell-ring.svg" alt="Notification icon">
        </div>
        <div id="profile-picture">Profile picture</div>
        <div id="name">Your account name</div>
     
        <div id="profile-picture">Profile picture</div>
        <div id="greeting">
            <p>Hi there,</p>
            <h3>Your account name</h3>
        </div>
        <div id="new">
            <button id="new-button">New</button>
        </div>
        <div id="upload">0
            <button id="upload-button">Upload</button>
        </div>
        <div id="share">
            <button id="share-button">Share</button>
        </div>
    </header>
</body>
</html>
